appId: com.inkspirit.app
productName: InkSpirit
copyright: Copyright © 2026 InkSpirit Contributors

publish:
  provider: github
  owner: Airliny
  repo: InkSpirit
  releaseType: release

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - node_modules/**/*
  - package.json
  - resources/**/*

asarUnpack:
  - node_modules/better-sqlite3/**/*

extraResources:
  - from: resources/avatar
    to: avatar

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico

linux:
  icon: resources/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: InkSpirit
  artifactName: InkSpirit-Setup-${version}.exe
